<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="Case file 2, SmartKart. The intern said give them 50 percent off. The server capped the discount at 15 percent." xmlns:c2pa="http://c2pa.org/manifest">
<title>Case file 2, SmartKart. The intern said give them 50 percent off. The server capped the discount at 15 percent.</title>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.s{font-family:Georgia,"Times New Roman",serif}
.i{font-style:italic}.b{font-weight:700}
.st{transform-origin:0 0;animation:slam .6s cubic-bezier(.2,.9,.3,1) .6s both}
@keyframes slam{0%{opacity:0;transform:scale(2.6)}65%{opacity:1;transform:scale(.93)}100%{opacity:1;transform:scale(1)}}
.strike{stroke-dasharray:1;animation:draw .5s ease-out 1.3s both}
.ck{stroke-dasharray:1;animation:draw .45s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.fill{transform-box:fill-box;transform-origin:0 50%;animation:meter 7s ease-in-out infinite}@keyframes meter{0%{transform:scaleX(0);fill:#C62F2F}35%{transform:scaleX(3.333);fill:#C62F2F}52%{transform:scaleX(3.333);fill:#C62F2F}68%{transform:scaleX(1);fill:#0F766E}100%{transform:scaleX(1);fill:#0F766E}}.ask{animation:ask 7s infinite}.got{animation:got 7s infinite}@keyframes ask{0%{opacity:0}8%,52%{opacity:1}60%,100%{opacity:0}}@keyframes got{0%,60%{opacity:0}70%,100%{opacity:1}}</style>
<rect x="3" y="3" width="894" height="474" rx="18" fill="#F7F1E3" stroke="#1E1B2E" stroke-width="4"/>
<rect x="380.0" y="0" width="140" height="22" rx="9" fill="#1E1B2E"/>
<text class="m b" x="40" y="62" font-size="22" fill="#1E1B2E" letter-spacing="2">CASE FILE 02 · SMARTKART</text><text class="m" x="860" y="62" text-anchor="end" font-size="19" fill="#6F6A5A">React 19 · Express 5 · MongoDB</text><line x1="40" y1="82" x2="860" y2="82" stroke="#1E1B2E" stroke-width="2" stroke-dasharray="6 6"/><text class="m b" x="40" y="130" text-anchor="start" font-size="18" fill="#6F6A5A" letter-spacing="3">THE INTERN SAID</text><text class="s i" x="40" y="186" font-size="40" fill="#1E1B2E">“Give them 50% off.</text><text class="s i" x="40" y="234" font-size="40" fill="#1E1B2E">They seem nice.”</text><g transform="translate(715 190)"><g class="st" style="animation-delay:0.9s"><g transform="rotate(7)"><rect x="-120.0" y="-34.0" width="240" height="68" rx="8" fill="#F7F1E3" fill-opacity=".6" stroke="#C62F2F" stroke-width="6"/><text class="m b" x="0" y="13.3" text-anchor="middle" font-size="38" fill="#C62F2F" letter-spacing="3">CAPPED</text></g></g></g><text class="m b" x="40" y="314" text-anchor="start" font-size="18" fill="#6F6A5A" letter-spacing="3">DISCOUNT ACTUALLY GRANTED</text><text class="m b ask" x="860" y="316" text-anchor="end" font-size="25" fill="#C62F2F" opacity="0">ASK: 50%</text><text class="m b got" x="860" y="316" text-anchor="end" font-size="25" fill="#0F766E">GRANTED: 15%</text><rect x="40" y="334" width="820" height="54" rx="10" fill="#E7DFCB" stroke="#1E1B2E" stroke-width="3"/><rect class="fill" x="40" y="334" width="246" height="54" rx="10" fill="#0F766E"/><line x1="286" y1="322" x2="286" y2="402" stroke="#1E1B2E" stroke-width="4"/><text class="m b" x="286" y="432" font-size="21" fill="#1E1B2E">15% hard cap, enforced by the server</text><text class="m" x="40" y="464" font-size="18" fill="#6F6A5A">0%</text><text class="m" x="860" y="464" text-anchor="end" font-size="18" fill="#6F6A5A">50% (the ask)</text>
</svg>