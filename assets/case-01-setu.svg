<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-label="Case file 1, SETU.ai, a simulated voice prototype that is not connected to 112. The intern is cut off mid-sentence when the caller interrupts, and playback stops locally in 0.2 to 1.5 milliseconds as measured in tests." xmlns:c2pa="http://c2pa.org/manifest">
<title>Case file 1, SETU.ai, a simulated voice prototype that is not connected to 112. The intern is cut off mid-sentence when the caller interrupts, and playback stops locally in 0.2 to 1.5 milliseconds as measured in tests.</title>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.s{font-family:Georgia,"Times New Roman",serif}
.i{font-style:italic}.b{font-weight:700}
.st{transform-origin:0 0;animation:slam .6s cubic-bezier(.2,.9,.3,1) .6s both}
@keyframes slam{0%{opacity:0;transform:scale(2.6)}65%{opacity:1;transform:scale(.93)}100%{opacity:1;transform:scale(1)}}
.strike{stroke-dasharray:1;animation:draw .5s ease-out 1.3s both}
.ck{stroke-dasharray:1;animation:draw .45s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.bar{transform-box:fill-box;transform-origin:center;animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}.cut{animation:blink 1.6s steps(2,jump-none) infinite}@keyframes blink{50%{opacity:.35}}</style>
