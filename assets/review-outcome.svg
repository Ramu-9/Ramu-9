<svg aria-label="Review outcome checklist. Keep the intern, checked. Give the intern production access, denied. Write the tests anyway, checked." role="img" viewBox="0 0 900 370" xmlns="http://www.w3.org/2000/svg">
 <title>Review outcome checklist. Keep the intern, checked. Give the intern production access, denied. Write the tests anyway, checked.</title>
 <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.s{font-family:Georgia,"Times New Roman",serif}
.i{font-style:italic}.b{font-weight:700}
.st{transform-origin:0 0;animation:slam .6s cubic-bezier(.2,.9,.3,1) .6s both}
@keyframes slam{0%{opacity:0;transform:scale(2.6)}65%{opacity:1;transform:scale(.93)}100%{opacity:1;transform:scale(1)}}
.strike{stroke-dasharray:1;animation:draw .5s ease-out 1.3s both}
.ck{stroke-dasharray:1;animation:draw .45s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
 <rect x="3" y="3" width="894" height="364" rx="18" fill="#F7F1E3" stroke="#1E1B2E" stroke-width="4"/>
 <rect x="380" width="140" height="22" rx="9" fill="#1E1B2E"/>
 <text class="m b" x="40" y="62" fill="#1E1B2E" font-size="22" letter-spacing="2">REVIEW OUTCOME</text>
 <text class="m" x="860" y="62" fill="#6F6A5A" font-size="19" text-anchor="end">reviewer: Ramu Maddirala</text>
 <line x1="40" x2="860" y1="82" y2="82" stroke="#1E1B2E" stroke-dasharray="6 6" stroke-width="2"/>
 <rect x="40" y="120" width="40" height="40" rx="6" fill="none" stroke="#1E1B2E" stroke-width="4"/>
 <path class="ck" d="m47 141 11 10 18-25" fill="none" stroke="#0F766E" stroke-linecap="round" stroke-linejoin="round" stroke-width="7" style="animation-delay:0.4s" pathLength="1"/>
 <text class="m" x="104" y="150" fill="#1E1B2E" font-size="28">Keep the intern. It is fast.</text>
 <rect x="40" y="188" width="40" height="40" rx="6" fill="none" stroke="#1E1B2E" stroke-width="4"/>
 <text class="m" x="104" y="218" fill="#1E1B2E" font-size="28">Give the intern production access.</text>
 <rect x="40" y="256" width="40" height="40" rx="6" fill="none" stroke="#1E1B2E" stroke-width="4"/>
 <path class="ck" d="m47 277 11 10 18-25" fill="none" stroke="#0F766E" stroke-linecap="round" stroke-linejoin="round" stroke-width="7" style="animation-delay:1.4s" pathLength="1"/>
 <text class="m" x="104" y="286" fill="#1E1B2E" font-size="28">Write the tests anyway.</text>
 <g transform="translate(772 218)">
  <g class="st" style="animation-delay:1.6s">
   <g transform="rotate(-8)">
    <rect x="-85" y="-27" width="170" height="54" rx="8" fill="#F7F1E3" fill-opacity=".6" stroke="#C62F2F" stroke-width="6"/>
    <text class="m b" y="9.8" fill="#C62F2F" font-size="28" letter-spacing="3" text-anchor="middle">DENIED</text>
   </g>
  </g>
 </g>
</svg>
