<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ramu.exe engineering profile banner</title>
  <desc id="desc">A dark engineering control-room banner introducing Ramu as a backend and applied AI builder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.58" stop-color="#111b2c"/>
      <stop offset="1" stop-color="#102c32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55e6c1"/>
      <stop offset="1" stop-color="#b5f36d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8ca6bf" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M0 286C180 238 286 342 472 288S760 220 920 276s194 34 280-8V360H0Z" fill="#55e6c1" opacity=".045"/>
  <rect x="44" y="38" width="6" height="276" rx="3" fill="url(#accent)"/>
  <text x="78" y="76" fill="#7be8cb" font-family="monospace" font-size="15" letter-spacing="3">INDEPENDENT BUILDER / INDIA</text>
  <text x="72" y="176" fill="#f4f7fb" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="90" letter-spacing="-4">RAMU<tspan fill="#72e7c6">.EXE</tspan></text>
  <text x="80" y="221" fill="#d1dce8" font-family="Arial, Helvetica, sans-serif" font-size="24">Backend systems  ·  Applied AI  ·  Real-time products</text>
  <text x="80" y="274" fill="#91a5b9" font-family="monospace" font-size="16">I build the workflow. Then I test the edge cases.</text>
  <g transform="translate(800 68)">
    <rect width="350" height="228" rx="18" fill="#0a1321" stroke="#33505a" stroke-width="1.5"/>
    <path d="M0 48H350" stroke="#33505a"/>
    <circle cx="24" cy="24" r="5" fill="#fb7185"/>
    <circle cx="44" cy="24" r="5" fill="#fbbf24"/>
    <circle cx="64" cy="24" r="5" fill="#5eead4"/>
    <text x="88" y="29" fill="#9fb3c8" font-family="monospace" font-size="13">build-log / latest</text>
    <g font-family="monospace" font-size="14">
      <text x="24" y="82" fill="#7b91a8">01</text><text x="58" y="82" fill="#e2e8f0">listen()</text><text x="190" y="82" fill="#5eead4">SETU.ai</text>
      <text x="24" y="119" fill="#7b91a8">02</text><text x="58" y="119" fill="#e2e8f0">understand()</text><text x="190" y="119" fill="#5eead4">SmartKart</text>
      <text x="24" y="156" fill="#7b91a8">03</text><text x="58" y="156" fill="#e2e8f0">simulate()</text><text x="190" y="156" fill="#5eead4">PitchIQ</text>
    </g>
    <rect x="24" y="180" width="302" height="27" rx="7" fill="#173d3a"/>
    <circle cx="39" cy="193.5" r="4" fill="#a3e635" filter="url(#glow)"/>
    <text x="52" y="198" fill="#bdf5df" font-family="monospace" font-size="12">all systems curious · status: BUILDING</text>
  </g>
  <text x="1150" y="332" fill="#597184" font-family="monospace" font-size="11" text-anchor="end">BITS PILANI / CS '28</text>
</svg>